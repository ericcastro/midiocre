[project]
name = "midiocre"
version = "0.1.0"
description = "Local-first MIDI practice and AI tutoring backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "mido>=1.3.3",
  "openai>=2.0.0",
  "pydantic>=2.11.0",
  "python-dotenv>=1.1.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
